<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Floor tile pattern -->
    <pattern id="floorTile" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Tile base -->
      <rect width="40" height="40" fill="#1E2A3A" rx="1"/>
      <rect x="1" y="1" width="38" height="38" fill="#1F2B3B" rx="0.5"/>
      <!-- Subtle bevel -->
      <rect x="1" y="1" width="38" height="1" fill="#2A3A4E" opacity="0.3"/>
      <rect x="1" y="1" width="1" height="38" fill="#2A3A4E" opacity="0.3"/>
      <rect x="1" y="39" width="38" height="1" fill="#121A26" opacity="0.3"/>
      <rect x="39" y="1" width="1" height="38" fill="#121A26" opacity="0.3"/>
      <!-- Micro noise dot -->
      <circle cx="20" cy="20" r="0.5" fill="#3A4A5E" opacity="0.15"/>
    </pattern>

    <!-- Carpet texture for work area -->
    <pattern id="carpet" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="transparent"/>
      <circle cx="6" cy="6" r="0.8" fill="#4A6A8A" opacity="0.08"/>
      <circle cx="0" cy="0" r="0.6" fill="#4A6A8A" opacity="0.05"/>
      <circle cx="12" cy="12" r="0.6" fill="#4A6A8A" opacity="0.05"/>
    </pattern>

    <!-- Wall corner decoration -->
    <linearGradient id="wallShadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base floor -->
  <rect width="200" height="200" fill="url(#floorTile)"/>

  <!-- Work area subtle highlight -->
  <rect x="1" y="1" width="98" height="96" fill="url(#carpet)" opacity="0.5"/>
  <!-- Break room subtle highlight -->
  <rect x="101" y="1" width="98" height="96" fill="none"/>
  <!-- Boss office subtle highlight -->
  <rect x="1" y="100" width="98" height="76" fill="url(#carpet)" opacity="0.3"/>
  <!-- Toilet area -->
  <rect x="101" y="100" width="98" height="76" fill="none"/>
</svg>
