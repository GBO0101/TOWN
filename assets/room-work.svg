<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="carpet" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="transparent"/>
      <!-- Cubicle grid -->
      <line x1="0" y1="10" x2="20" y2="10" stroke="#3A5A8A" stroke-width="0.3" opacity="0.15"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#3A5A8A" stroke-width="0.3" opacity="0.15"/>
      <!-- Subtle dot weave -->
      <circle cx="10" cy="10" r="0.8" fill="#4A7ABF" opacity="0.08"/>
      <circle cx="0" cy="0" r="0.5" fill="#4A7ABF" opacity="0.06"/>
      <circle cx="20" cy="20" r="0.5" fill="#4A7ABF" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#carpet)"/>
</svg>
