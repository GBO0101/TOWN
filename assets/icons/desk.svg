<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="18" fill="#4D96FF" opacity="0.1"/>
  <!-- Desk top surface -->
  <rect x="6" y="16" width="28" height="4" rx="1" fill="#8B6914"/>
  <rect x="6" y="16" width="28" height="3" rx="1" fill="#A07818"/>
  <!-- Desk top highlight -->
  <rect x="8" y="16.5" width="24" height="1" fill="#C49A20" opacity="0.4"/>
  <!-- Drawers -->
  <rect x="7" y="20" width="26" height="8" rx="1" fill="#6B4F10"/>
  <!-- Drawer divider -->
  <line x1="20" y1="20" x2="20" y2="28" stroke="#5A4210" stroke-width="0.8"/>
  <!-- Drawer handles -->
  <rect x="13" y="23" width="4" height="1.5" rx="0.5" fill="#C49A20"/>
  <rect x="23" y="23" width="4" height="1.5" rx="0.5" fill="#C49A20"/>
  <!-- Legs -->
  <rect x="8" y="28" width="2" height="5" rx="0.5" fill="#5A4210"/>
  <rect x="30" y="28" width="2" height="5" rx="0.5" fill="#5A4210"/>
  <!-- Items on desk -->
  <!-- Monitor -->
  <rect x="15" y="8" width="10" height="8" rx="1" fill="#2C3E50"/>
  <rect x="16" y="9" width="8" height="6" rx="0.5" fill="#4D96FF" opacity="0.6"/>
  <rect x="17" y="9" width="3.5" height="5" rx="0.3" fill="#6DB3FF" opacity="0.3"/>
  <!-- Monitor stand -->
  <rect x="17" y="14" width="6" height="2" rx="0.5" fill="#34495E"/>
  <rect x="19.5" y="14.5" width="1" height="2" fill="#34495E"/>
  <!-- Small plant -->
  <rect x="28" y="12" width="4" height="4" rx="1" fill="#8B4513"/>
  <circle cx="30" cy="10" r="3.5" fill="#6BCB77"/>
  <circle cx="28" cy="9" r="2.5" fill="#7DD884"/>
  <circle cx="32" cy="9.5" r="2" fill="#5CBF64"/>
</svg>
