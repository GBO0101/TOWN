<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="18" fill="#FF6B6B" opacity="0.1"/>
  <!-- Bigger desk top -->
  <rect x="5" y="16" width="30" height="4" rx="1" fill="#4A2F0A"/>
  <rect x="5" y="16" width="30" height="3" rx="1" fill="#5C3C10"/>
  <rect x="7" y="16.5" width="26" height="1" fill="#7A5220" opacity="0.4"/>
  <!-- Desk front panel -->
  <rect x="6" y="20" width="28" height="8" rx="1" fill="#3D2508"/>
  <!-- Wood grain -->
  <line x1="8" y1="22" x2="32" y2="22" stroke="#4A2F0A" stroke-width="0.3" opacity="0.5"/>
  <line x1="8" y1="24" x2="32" y2="24" stroke="#4A2F0A" stroke-width="0.3" opacity="0.5"/>
  <line x1="8" y1="26" x2="32" y2="26" stroke="#4A2F0A" stroke-width="0.3" opacity="0.5"/>
  <!-- Drawers -->
  <rect x="7" y="21" width="12" height="6" rx="0.5" fill="#3D2508"/>
  <rect x="21" y="21" width="12" height="6" rx="0.5" fill="#3D2508"/>
  <!-- Drawer handles -->
  <circle cx="13" cy="24" r="1" fill="#C49A20"/>
  <circle cx="27" cy="24" r="1" fill="#C49A20"/>
  <!-- Legs -->
  <rect x="7" y="28" width="2" height="4" rx="0.5" fill="#3D2508"/>
  <rect x="31" y="28" width="2" height="4" rx="0.5" fill="#3D2508"/>
  <!-- Nameplate -->
  <rect x="16" y="12" width="8" height="3" rx="0.5" fill="#C49A20"/>
  <rect x="17" y="12.5" width="6" height="2" rx="0.3" fill="#D4AA30"/>
  <text x="20" y="14" text-anchor="middle" font-size="1.5" fill="#5A4210" font-weight="bold">總</text>
  <!-- Items on desk -->
  <!-- Dual monitors -->
  <rect x="8" y="7" width="7" height="7" rx="0.5" fill="#2C3E50"/>
  <rect x="9" y="8" width="5" height="5" rx="0.3" fill="#4D96FF" opacity="0.5"/>
  <rect x="10" y="8" width="2" height="4" rx="0.2" fill="#6DB3FF" opacity="0.3"/>
  <rect x="24" y="7" width="7" height="7" rx="0.5" fill="#2C3E50"/>
  <rect x="25" y="8" width="5" height="5" rx="0.3" fill="#4D96FF" opacity="0.5"/>
  <rect x="26" y="8" width="2" height="4" rx="0.2" fill="#6DB3FF" opacity="0.3"/>
  <!-- Pen holder -->
  <rect x="18" y="8" width="3" height="6" rx="0.5" fill="#555"/>
  <line x1="19" y1="8" x2="19" y2="7" stroke="#FF6B6B" stroke-width="0.8"/>
  <line x1="19.5" y1="8" x2="19.5" y2="7.5" stroke="#4D96FF" stroke-width="0.8"/>
</svg>
