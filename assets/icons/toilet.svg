<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="18" fill="#C084FC" opacity="0.1"/>
  <!-- Toilet bowl -->
  <ellipse cx="20" cy="22" rx="11" ry="10" fill="#F5F5F5" stroke="#DDD" stroke-width="0.8"/>
  <ellipse cx="20" cy="20" rx="9" ry="7" fill="#FAFAFA" stroke="#EEE" stroke-width="0.5"/>
  <!-- Bowl water -->
  <ellipse cx="20" cy="21" rx="7" ry="5" fill="#4D96FF" opacity="0.2"/>
  <!-- Seat -->
  <path d="M11 20 Q11 12 20 11 Q29 12 29 20" fill="none" stroke="#DDD" stroke-width="1.5"/>
  <!-- Hinge -->
  <ellipse cx="20" cy="12" rx="2" ry="1" fill="#CCC"/>
  <!-- Tank -->
  <rect x="14" y="5" width="12" height="8" rx="2" fill="#F0F0F0" stroke="#DDD" stroke-width="0.8"/>
  <rect x="14" y="5" width="12" height="6" rx="2" fill="#FAFAFA"/>
  <!-- Tank top -->
  <rect x="16" y="3" width="8" height="3" rx="1" fill="#F5F5F5" stroke="#DDD" stroke-width="0.5"/>
  <!-- Flush button -->
  <circle cx="20" cy="7" r="1.5" fill="#CCC"/>
  <circle cx="20" cy="7" r="0.8" fill="#DDD"/>
  <!-- Toilet paper -->
  <circle cx="30" cy="26" r="3.5" fill="#FFF" stroke="#EEE" stroke-width="0.5"/>
  <circle cx="30" cy="26" r="1.5" fill="#F8F8F8"/>
  <circle cx="30" cy="26" r="0.5" fill="#EEE"/>
</svg>
