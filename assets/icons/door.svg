<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <circle cx="20" cy="20" r="18" fill="#FF8C42" opacity="0.1"/>
  <!-- Door frame -->
  <rect x="10" y="6" width="20" height="28" rx="1" fill="#8B5E3C" stroke="#6B3E1C" stroke-width="0.8"/>
  <!-- Door panel -->
  <rect x="11" y="7" width="18" height="26" rx="0.5" fill="#A0784C"/>
  <!-- Panel details -->
  <rect x="13" y="9" width="14" height="10" rx="0.5" fill="#8B6840" opacity="0.5"/>
  <rect x="13" y="21" width="14" height="10" rx="0.5" fill="#8B6840" opacity="0.5"/>
  <!-- Door handle -->
  <circle cx="16" cy="20" r="1.8" fill="#C49A20" stroke="#A07818" stroke-width="0.5"/>
  <circle cx="16" cy="20" r="0.8" fill="#D4AA30"/>
  <!-- Keyhole -->
  <circle cx="16" cy="23" r="1" fill="#5A4210"/>
  <rect x="15.5" y="23" width="1" height="1.5" fill="#5A4210"/>
  <!-- Door hinge -->
  <rect x="27" y="10" width="1.5" height="3" rx="0.3" fill="#8B6840"/>
  <rect x="27" y="17" width="1.5" height="3" rx="0.3" fill="#8B6840"/>
  <rect x="27" y="24" width="1.5" height="3" rx="0.3" fill="#8B6840"/>
  <!-- Floor shadow -->
  <ellipse cx="20" cy="34" rx="12" ry="1" fill="#000" opacity="0.1"/>
  <!-- Open indicator (small arrow) -->
  <path d="M32 16 L36 18 L32 20" fill="none" stroke="#FF8C42" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>
