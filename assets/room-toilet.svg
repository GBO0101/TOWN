<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="tile" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="transparent"/>
      <!-- Ceramic tile grid -->
      <rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="#4A4A6A" stroke-width="0.4" opacity="0.12" rx="0.5"/>
      <!-- Tile highlight -->
      <line x1="0.5" y1="0.5" x2="15.5" y2="0.5" stroke="#6A6A8A" stroke-width="0.3" opacity="0.08"/>
      <line x1="0.5" y1="0.5" x2="0.5" y2="15.5" stroke="#6A6A8A" stroke-width="0.3" opacity="0.08"/>
      <!-- Grout shadow -->
      <line x1="15.5" y1="0.5" x2="15.5" y2="15.5" stroke="#2A2A3A" stroke-width="0.3" opacity="0.08"/>
      <line x1="0.5" y1="15.5" x2="15.5" y2="15.5" stroke="#2A2A3A" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#tile)"/>
</svg>
