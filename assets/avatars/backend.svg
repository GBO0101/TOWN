<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#DF6C22"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)" opacity="0.2"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FF8C42" stroke-width="1.5" opacity="0.3"/>
  <!-- Plaid shirt body -->
  <path d="M30 72 L30 52 Q30 40 38 36 L62 36 Q70 40 70 52 L70 72 Z" fill="#4A3728"/>
  <!-- Plaid pattern -->
  <line x1="40" y1="36" x2="40" y2="72" stroke="#5C4738" stroke-width="0.8"/>
  <line x1="50" y1="36" x2="50" y2="72" stroke="#5C4738" stroke-width="0.8"/>
  <line x1="60" y1="36" x2="60" y2="72" stroke="#5C4738" stroke-width="0.8"/>
  <line x1="30" y1="42" x2="70" y2="42" stroke="#5C4738" stroke-width="0.5"/>
  <line x1="30" y1="50" x2="70" y2="50" stroke="#5C4738" stroke-width="0.5"/>
  <line x1="30" y1="58" x2="70" y2="58" stroke="#5C4738" stroke-width="0.5"/>
  <line x1="30" y1="66" x2="70" y2="66" stroke="#5C4738" stroke-width="0.5"/>
  <!-- Collar -->
  <path d="M44 40 L50 46 L56 40" fill="none" stroke="#FF8C42" stroke-width="1"/>
  <!-- Neck -->
  <rect x="44" y="34" width="12" height="6" rx="3" fill="#FDBCB4"/>
  <!-- Head -->
  <ellipse cx="50" cy="26" rx="15" ry="16" fill="#FDBCB4"/>
  <!-- Short receding hair -->
  <path d="M36 20 Q36 8 50 6 Q64 8 64 20" fill="#3D2218"/>
  <path d="M36 18 Q38 10 50 8 Q62 10 64 18" fill="#4A2D1E"/>
  <!-- Bald spot -->
  <ellipse cx="50" cy="10" rx="6" ry="3" fill="#FDBCB4" opacity="0.5"/>
  <!-- Side hair -->
  <path d="M36 20 Q33 24 33 28 Q33 22 36 18" fill="#3D2218"/>
  <path d="M64 20 Q67 24 67 28 Q67 22 64 18" fill="#3D2218"/>
  <!-- Beard -->
  <path d="M36 32 Q36 40 42 44 Q48 46 50 46 Q52 46 58 44 Q64 40 64 32" fill="#3D2218"/>
  <path d="M38 34 Q40 42 50 44 Q60 42 62 34" fill="#4A2D1E"/>
  <!-- Eyes (tired/calm) -->
  <ellipse cx="43" cy="24" rx="2.5" ry="2.5" fill="white"/>
  <ellipse cx="57" cy="24" rx="2.5" ry="2.5" fill="white"/>
  <circle cx="43" cy="25" r="1.5" fill="#444"/>
  <circle cx="57" cy="25" r="1.5" fill="#444"/>
  <!-- Eyebrows -->
  <path d="M38 19 Q43 17 48 19" fill="none" stroke="#3D2218" stroke-width="1.3"/>
  <path d="M52 19 Q57 17 62 19" fill="none" stroke="#3D2218" stroke-width="1.3"/>
  <!-- Nose -->
  <path d="M50 27 L50 31 Q52 31 52 30" fill="none" stroke="#E8A090" stroke-width="1"/>
  <!-- Mouth (neutral/slight smile) -->
  <path d="M44 37 Q50 39 56 37" fill="none" stroke="#C07060" stroke-width="1.2"/>
  <!-- Arms -->
  <rect x="28" y="50" width="5" height="22" rx="3" fill="#4A3728"/>
  <rect x="67" y="50" width="5" height="22" rx="3" fill="#4A3728"/>
  <!-- Hands -->
  <circle cx="30" cy="72" r="3" fill="#FDBCB4"/>
  <circle cx="70" cy="72" r="3" fill="#FDBCB4"/>
  <!-- Coffee cup in hand -->
  <rect x="63" y="56" width="5" height="7" rx="1" fill="#FFF" stroke="#CCC" stroke-width="0.5"/>
  <path d="M68 58 Q70 59 70 61 Q70 63 68 64" fill="none" stroke="#CCC" stroke-width="0.8"/>
  <ellipse cx="65.5" cy="57" rx="2" ry="1" fill="#6B3A1F"/>
  <!-- Steam -->
  <path d="M64 54 Q63 52 64 50" fill="none" stroke="#CCC" stroke-width="0.5" opacity="0.5"/>
  <path d="M66 54 Q65 51 66 49" fill="none" stroke="#CCC" stroke-width="0.5" opacity="0.5"/>
</svg>
