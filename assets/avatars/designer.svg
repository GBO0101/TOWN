  <ellipse cx="43" cy="26" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="57" cy="26" rx="2.5" ry="3" fill="white"/>
  <circle cx="43" cy="27" r="1.5" fill="#333"/>
  <circle cx="57" cy="27" r="1.5" fill="#333"/>
  <!-- Eyelashes -->
  <path d="M40 23 L42 24" stroke="#333" stroke-width="0.8"/>
  <path d="M43 22 L43 24" stroke="#333" stroke-width="0.8"/>
  <path d="M46 23 L44 24" stroke="#333" stroke-width="0.8"/>
  <path d="M54 23 L56 24" stroke="#333" stroke-width="0.8"/>
  <path d="M57 22 L57 24" stroke="#333" stroke-width="0.8"/>
  <path d="M60 23 L58 24" stroke="#333" stroke-width="0.8"/>
