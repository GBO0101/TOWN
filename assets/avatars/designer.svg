  <path d="M43 36 Q50 41 57 36" fill="none" stroke="#C07060" stroke-width="1.2"/>
  <!-- Blush -->
  <ellipse cx="38" cy="34" rx="3" ry="2" fill="#F4A0B0" opacity="0.4"/>
  <ellipse cx="62" cy="34" rx="3" ry="2" fill="#F4A0B0" opacity="0.4"/>
