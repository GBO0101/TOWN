  <circle cx="32" cy="72" r="3" fill="#FDBCB4"/>
  <circle cx="68" cy="72" r="3" fill="#FDBCB4"/>
  <!-- Pen behind ear -->
  <line x1="66" y1="24" x2="68" y2="16" stroke="#FFD93D" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="66.5" y="18" width="3" height="2" rx="1" fill="#FFD93D"/>
