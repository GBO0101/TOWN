<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E04848"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)" opacity="0.2"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FF6B6B" stroke-width="1.5" opacity="0.3"/>
  <!-- Suit body -->
  <path d="M30 72 L30 52 Q30 42 38 38 L62 38 Q70 42 70 52 L70 72 Z" fill="#2C2C2C"/>
  <!-- Shirt collar -->
  <path d="M42 42 L50 50 L58 42" fill="none" stroke="white" stroke-width="1.5"/>
  <!-- Tie -->
  <path d="M48 50 L50 68 L52 50 Z" fill="#FF6B6B"/>
  <!-- Neck -->
  <rect x="44" y="36" width="12" height="8" rx="4" fill="#FDBCB4"/>
  <!-- Head -->
  <ellipse cx="50" cy="28" rx="15" ry="16" fill="#FDBCB4"/>
  <!-- Hair (gray/short) -->
  <path d="M35 24 Q35 10 50 8 Q65 10 65 24 L65 20 Q65 8 50 6 Q35 8 35 20 Z" fill="#5A5A5A"/>
  <path d="M35 22 Q40 14 50 12 Q60 14 65 22" fill="#5A5A5A" opacity="0.5"/>
  <!-- Side hair -->
  <path d="M35 24 Q33 28 33 32 Q33 28 35 24" fill="#5A5A5A"/>
  <path d="M65 24 Q67 28 67 32 Q67 28 65 24" fill="#5A5A5A"/>
  <!-- Glasses -->
  <rect x="37" y="24" width="11" height="8" rx="2" fill="none" stroke="#444" stroke-width="1.2"/>
  <rect x="52" y="24" width="11" height="8" rx="2" fill="none" stroke="#444" stroke-width="1.2"/>
  <line x1="48" y1="28" x2="52" y2="28" stroke="#444" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="42" cy="28" r="1.5" fill="#444"/>
  <circle cx="57" cy="28" r="1.5" fill="#444"/>
  <!-- Eyebrows -->
  <path d="M38 21 Q42 19 46 21" fill="none" stroke="#5A5A5A" stroke-width="1.2"/>
  <path d="M54 21 Q58 19 62 21" fill="none" stroke="#5A5A5A" stroke-width="1.2"/>
  <!-- Nose -->
  <path d="M50 30 L50 34 Q52 34 52 33" fill="none" stroke="#E8A090" stroke-width="1"/>
  <!-- Mouth (slight smile) -->
  <path d="M43 38 Q50 42 57 38" fill="none" stroke="#C07060" stroke-width="1.2"/>
  <!-- Arms -->
  <rect x="28" y="52" width="5" height="20" rx="3" fill="#2C2C2C"/>
  <rect x="67" y="52" width="5" height="20" rx="3" fill="#2C2C2C"/>
  <!-- Hands -->
  <circle cx="30" cy="72" r="3" fill="#FDBCB4"/>
  <circle cx="70" cy="72" r="3" fill="#FDBCB4"/>
</svg>
