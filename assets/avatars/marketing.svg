<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#DFB91D"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)" opacity="0.2"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FFD93D" stroke-width="1.5" opacity="0.3"/>
  <!-- Blazer body -->
  <path d="M30 72 L30 52 Q30 40 38 36 L62 36 Q70 40 70 52 L70 72 Z" fill="#2C3E50"/>
  <!-- Lapels -->
  <path d="M42 40 L50 50 L42 50 Z" fill="#34495E"/>
  <path d="M58 40 L50 50 L58 50 Z" fill="#34495E"/>
  <!-- Shirt -->
  <path d="M44 40 L50 46 L56 40" fill="none" stroke="white" stroke-width="1"/>
  <!-- Pocket square -->
  <rect x="56" y="42" width="4" height="3" rx="0.5" fill="#FFD93D"/>
  <!-- Neck -->
  <rect x="44" y="34" width="12" height="6" rx="3" fill="#FDBCB4"/>
  <!-- Head -->
  <ellipse cx="50" cy="26" rx="15" ry="16" fill="#FDBCB4"/>
  <!-- Styled hair (slicked back) -->
  <path d="M35 22 Q35 6 50 4 Q65 6 65 22" fill="#2C1810"/>
  <path d="M35 20 Q38 10 50 8 Q62 10 65 20" fill="#3D2218"/>
  <path d="M35 22 Q33 26 33 30 Q33 24 35 20" fill="#2C1810"/>
  <path d="M65 22 Q67 26 67 30 Q67 24 65 20" fill="#2C1810"/>
  <!-- Hair parting -->
  <path d="M50 6 L50 14" stroke="#1A0E08" stroke-width="0.8"/>
  <!-- Eyebrows (expressive) -->
  <path d="M38 18 Q43 15 48 18" fill="none" stroke="#2C1810" stroke-width="1.3"/>
  <path d="M52 18 Q57 15 62 18" fill="none" stroke="#2C1810" stroke-width="1.3"/>
  <!-- Eyes -->
  <ellipse cx="43" cy="24" rx="2.5" ry="3" fill="white"/>
  <ellipse cx="57" cy="24" rx="2.5" ry="3" fill="white"/>
  <circle cx="43" cy="25" r="1.8" fill="#333"/>
  <circle cx="57" cy="25" r="1.8" fill="#333"/>
  <circle cx="42" cy="24" r="0.6" fill="white"/>
  <circle cx="56" cy="24" r="0.6" fill="white"/>
  <!-- Nose -->
  <path d="M50 27 L50 31 Q52 32 52 30" fill="none" stroke="#E8A090" stroke-width="1"/>
  <!-- Confident smile -->
  <path d="M42 34 Q50 40 58 34" fill="none" stroke="#C07060" stroke-width="1.3"/>
  <!-- Arm (one hand in pocket) -->
  <rect x="28" y="50" width="5" height="22" rx="3" fill="#2C3E50"/>
  <rect x="67" y="50" width="5" height="22" rx="3" fill="#2C3E50"/>
  <!-- Hands -->
  <circle cx="30" cy="72" r="3" fill="#FDBCB4"/>
  <circle cx="70" cy="72" r="3" fill="#FDBCB4"/>
  <!-- Watch on wrist -->
  <circle cx="69" cy="64" r="2.5" fill="#FFD93D" stroke="#D4A800" stroke-width="0.5"/>
  <circle cx="69" cy="64" r="1" fill="#FFF"/>
</svg>
