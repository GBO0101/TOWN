<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D96FF"/>
      <stop offset="100%" stop-color="#2D76DF"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg)" opacity="0.2"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#4D96FF" stroke-width="1.5" opacity="0.3"/>
  <!-- Hoodie body -->
  <path d="M30 72 L30 50 Q30 40 38 36 L62 36 Q70 40 70 50 L70 72 Z" fill="#3A3A5C"/>
  <!-- Hoodie front -->
  <path d="M40 36 L40 72 L60 72 L60 36" fill="#3A3A5C" opacity="0.3"/>
  <!-- Hoodie pocket -->
  <rect x="36" y="56" width="28" height="6" rx="3" fill="#2E2E4A"/>
  <!-- Hoodie drawstrings -->
  <line x1="44" y1="36" x2="43" y2="46" stroke="#AAA" stroke-width="1"/>
  <line x1="56" y1="36" x2="57" y2="46" stroke="#AAA" stroke-width="1"/>
  <circle cx="43" cy="47" r="1" fill="#AAA"/>
  <circle cx="57" cy="47" r="1" fill="#AAA"/>
  <!-- Neck -->
  <rect x="43" y="34" width="14" height="6" rx="3" fill="#FDBCB4"/>
  <!-- Head -->
  <ellipse cx="50" cy="26" rx="16" ry="17" fill="#FDBCB4"/>
  <!-- Messy hair (black/dark) -->
  <path d="M34 22 Q34 6 50 4 Q66 6 66 22" fill="#1A1A2E"/>
  <path d="M34 20 Q30 14 32 8 Q34 4 38 6" fill="#1A1A2E"/>
  <path d="M66 20 Q70 14 68 8 Q66 4 62 6" fill="#1A1A2E"/>
  <path d="M36 14 Q30 16 28 22 Q28 18 34 12" fill="#1A1A2E"/>
  <path d="M64 14 Q70 16 72 22 Q72 18 66 12" fill="#1A1A2E"/>
  <!-- Round glasses -->
  <circle cx="42" cy="26" r="7" fill="none" stroke="#4D96FF" stroke-width="1.5"/>
  <circle cx="58" cy="26" r="7" fill="none" stroke="#4D96FF" stroke-width="1.5"/>
  <line x1="49" y1="26" x2="51" y2="26" stroke="#4D96FF" stroke-width="1.5"/>
  <!-- Eyes -->
  <circle cx="42" cy="26" r="1.5" fill="#222"/>
  <circle cx="58" cy="26" r="1.5" fill="#222"/>
  <!-- Eyebrows -->
  <path d="M36 17 Q42 15 48 17" fill="none" stroke="#1A1A2E" stroke-width="1.3"/>
  <path d="M52 17 Q58 15 64 17" fill="none" stroke="#1A1A2E" stroke-width="1.3"/>
  <!-- Nose -->
  <path d="M50 28 L50 32 Q52 32 52 31" fill="none" stroke="#E8A090" stroke-width="1"/>
  <!-- Mouth (focused/neutral) -->
  <path d="M43 36 Q50 38 57 36" fill="none" stroke="#C07060" stroke-width="1.2"/>
  <!-- Arms -->
  <rect x="28" y="48" width="5" height="24" rx="3" fill="#3A3A5C"/>
  <rect x="67" y="48" width="5" height="24" rx="3" fill="#3A3A5C"/>
  <!-- Hands -->
  <circle cx="30" cy="72" r="3" fill="#FDBCB4"/>
  <circle cx="70" cy="72" r="3" fill="#FDBCB4"/>
</svg>
